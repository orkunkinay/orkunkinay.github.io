<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Orkun Kınay</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="https://orkunkinay.github.io{{url}}">
  <meta name="theme-color" content="#f6f4ee">
  <meta property="og:site_name" content="Orkun Kınay">
  <meta property="og:type" content="{{ogtype}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://orkunkinay.github.io{{url}}">
  <meta property="og:image" content="https://orkunkinay.github.io/assets/img/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="alternate" type="application/rss+xml" title="Orkun Kınay" href="/feed.xml">
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script type="module" src="/assets/js/site.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"><noscript><div class="wrap"><a href="/">Orkun Kınay</a> · <a href="/archive/">Archive</a></div></noscript></header>
  <main id="main" class="entry-page" data-entry="{{id}}" tabindex="-1">
    <div class="wrap">
      <header class="page-head">
        <p class="breadcrumb"><a href="/projects/">Projects</a> / {{title}}</p>
        <h1>{{title}}</h1>
        <p class="lede">{{description}}</p>
      </header>
      <!-- Delete the notice below once this page has real content. -->
      <p class="notice">Placeholder page. Content is being written. <a href="?empty">Preview the section structure</a></p>
      <div class="entry-meta" data-slot="meta"></div>

      <div class="entry-layout">
        <!-- Each body is empty until it has content; empty sections are hidden. Keep `></div>` with nothing inside. -->
        <div data-toc-source>
        <section class="entry-section" id="overview">
          <h2>Overview</h2>
          <div class="entry-section__body prose"></div>
        </section>
        <section class="entry-section" id="problem">
          <h2>Problem</h2>
          <div class="entry-section__body prose"></div>
        </section>
        <section class="entry-section" id="why-it-matters">
          <h2>Why it matters</h2>
          <div class="entry-section__body prose"></div>
        </section>
        <section class="entry-section" id="approach">
          <h2>Approach</h2>
          <div class="entry-section__body prose"></div>
        </section>
        <section class="entry-section" id="architecture">
          <h2>System / architecture</h2>
          <div class="entry-section__body prose"></div>
        </section>
        <section class="entry-section" id="experiments">
          <h2>Experiments</h2>
          <div class="entry-section__body prose"></div>
        </section>
        <section class="entry-section" id="results">
          <h2>Results</h2>
          <div class="entry-section__body prose"></div>
        </section>
        <section class="entry-section" id="learned">
          <h2>What I learned</h2>
          <div class="entry-section__body prose"></div>
        </section>
        <section class="entry-section" id="links">
          <h2>Links</h2>
          <div class="entry-section__body prose" data-slot="links"></div>
        </section>
        </div>
        <nav class="toc" data-toc aria-label="Contents"></nav>
      </div>

      <nav class="pager" data-slot="pager" aria-label="More projects"></nav>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate content and regenerate sitemap and feed
        run: |
          node scripts/site.mjs check
          node scripts/site.mjs build

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='scripts' --exclude='templates' --exclude='README.md' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
